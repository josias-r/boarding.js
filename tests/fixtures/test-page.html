<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Boarding.js Test Page</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/themes/basic.css" />
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: sans-serif;
        min-height: 200vh; /* Allow scrolling tests */
      }
      .box {
        width: 150px;
        height: 80px;
        padding: 10px;
        margin: 20px 0;
        background: #e0e7ff;
        border: 2px solid #6366f1;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box-clickable {
        cursor: pointer;
        user-select: none;
      }
      #outside-button {
        padding: 8px 16px;
        margin-bottom: 20px;
      }
      #interactive-target {
        background: #fed7aa;
        border-color: #f97316;
      }
      .flex-row {
        display: flex;
        gap: 20px;
      }
      #bottom-element {
        margin-top: 500px;
      }
    </style>
  </head>
  <body>
    <h1>Boarding Test Harness</h1>
    <button id="outside-button">Outside Button (Clicked: 0)</button>

    <div class="flex-row">
      <div id="box-1" class="box box-clickable">Box 1</div>
      <div id="box-2" class="box box-clickable">Box 2</div>
      <div id="box-3" class="box box-clickable">Box 3</div>
    </div>

    <div id="interactive-target" class="box box-clickable">Interactive Box (Clicked: 0)</div>

    <div id="dynamic-container"></div>

    <div id="bottom-element" class="box">Bottom Element</div>

    <script type="module">
      import { Boarding } from "../../dist/main.mjs";

      window.Boarding = Boarding;
      window.activeBoarding = null;

      let outsideClicks = 0;
      const outsideBtn = document.getElementById("outside-button");
      outsideBtn.addEventListener("click", () => {
        outsideClicks++;
        outsideBtn.textContent = `Outside Button (Clicked: ${outsideClicks})`;
      });

      let targetClicks = 0;
      const interactiveTarget = document.getElementById("interactive-target");
      interactiveTarget.addEventListener("click", () => {
        targetClicks++;
        interactiveTarget.textContent = `Interactive Box (Clicked: ${targetClicks})`;
      });
    </script>
  </body>
</html>
